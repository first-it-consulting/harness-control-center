apiVersion: hcc/v1alpha1
kind: Harness
metadata:
  name: a2a-review
  description: Asks another agent (over A2A) to review a change, and asks you before sending.
spec:
  runtime: claude-code
  prompt: |
    Write a short summary of the change described in CHANGE.md, send it to
    the A2A agent "reviewer" with hcc-guest, and report its answer.
  target: server:homelab-01
  sandbox:
    image: claude-code
    timeout: 20m
  a2a:
    agents:
      - name: reviewer
        url: https://agents.example.com/a2a
  permissions:
    network:
      egress:
        - host: agents.example.com
  approvals:
    requireFor: [a2a.reviewer.send]
