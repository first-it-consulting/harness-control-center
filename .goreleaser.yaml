version: 2
project_name: hcc

before:
  hooks:
    - go mod verify

builds:
  - id: hcc
    main: ./cmd/hcc
    binary: hcc
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/first-it-consulting/harness-control-center/internal/version.Version={{ .Version }}
      - -X github.com/first-it-consulting/harness-control-center/internal/version.Commit={{ .Commit }}
      - -X github.com/first-it-consulting/harness-control-center/internal/version.Date={{ .CommitDate }}
    # Reproducible builds: timestamps come from the commit, not the clock.
    mod_timestamp: "{{ .CommitTimestamp }}"

  # The runner's only root-side code; Linux only.
  - id: hcc-helper
    main: ./cmd/hcc-helper
    binary: hcc-helper
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

  # Runs inside sandboxes (the claude-code image); Linux only.
  - id: hcc-guest
    main: ./cmd/hcc-guest
    binary: hcc-guest
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    # hcc-helper exists only for Linux, so archives differ in content.
    allow_different_binary_count: true
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# One SPDX SBOM per archive (requires syft).
sboms:
  - artifacts: archive

# Keyless signing with Sigstore: the signature binds the checksums file to
# this repository's release workflow identity. No long-lived keys exist.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

# release-please writes the changelog and creates the release; GoReleaser
# only attaches artifacts to it.
changelog:
  disable: true

release:
  mode: keep-existing
