version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Writes to an in-memory or terminal writer in the CLI; nothing to handle.
      - path: cmd/
        linters: [errcheck]
        text: "fmt.Fprint"
      # Tests read files they created themselves in t.TempDir(), and run
      # fixed tools (tar, mkfs.ext4, pgrep) with test-controlled arguments.
      - path: _test\.go
        linters: [gosec]
        text: "G304|G204|G702|G703"

formatters:
  enable:
    - gofmt
    - goimports
