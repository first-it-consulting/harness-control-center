name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the harness file if relevant. Remove any secrets first.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Output of `hcc version`
    validations:
      required: true
